# HTTP: answer container health checks and redirect everything else to HTTPS.
server {
    listen 80;
    server_name _;

    # Plain-HTTP health endpoint that intentionally does NOT redirect.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: serve the SPA, static assets and the /api reverse proxy.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are handled by the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend Compose service, keeping the /api prefix
    # (proxy_pass has no URI suffix, so the original request path is preserved).
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable: cache them aggressively.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
