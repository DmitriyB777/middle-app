server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are handled by the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend Compose service, keeping the /api prefix
    # (proxy_pass has no URI suffix, so the original request path is preserved).
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable: cache them aggressively.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
