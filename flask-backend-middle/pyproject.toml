[project]
name = "flask-backend-middle"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "blinker==1.9.0",
    "click==8.3.2",
    "colorama==0.4.6",
    "flask==3.1.3",
    "flask-jwt-extended==4.7.1",
    "flask-migrate==4.1.0",
    "flask-sqlalchemy==3.1.1",
    "greenlet==3.4.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "mako==1.3.10",
    "markupsafe==3.0.3",
    "psycopg2-binary==2.9.11",
    "pyjwt==2.12.1",
    "sqlalchemy==2.0.49",
    "typing-extensions==4.15.0",
    "werkzeug==3.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
markers = [
    "unit: isolated unit tests using mocks",
    "integration: tests hitting the Flask test client with an in-memory DB",
    "e2e: full end-to-end user journeys",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]
